# Langfuse 自托管栈（LLM 监测后端），供本地开发观察 Cove Agent 的 run/model/tool trace。
#
# 用法：
#   docker compose -f deployments/docker-compose.observability.yml up -d
#   打开 http://localhost:3000 注册账号 → 建 project → 拿 public/secret key
#   AUTH=$(echo -n "pk-lf-xxx:sk-lf-xxx" | base64)
#   export OTEL_ENABLED=true
#   export OTEL_TRACES_ENDPOINT=http://localhost:3000/api/public/otel/v1/traces
#   export OTEL_TRACES_HEADERS="Authorization=Basic ${AUTH}"
#   启动 Cove API 并发起一次 chat，即可在 Langfuse 看到 trace。
#
# 注意：本文件用固定开发口令，仅供本地；请勿用于生产。生产请参考 Langfuse 官方自托管指南。
name: cove-observability

services:
  langfuse-web:
    image: docker.io/langfuse/langfuse:3
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment: &langfuse-env
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-nextauth-secret-change-me
      SALT: dev-salt-change-me
      ENCRYPTION_KEY: a2c40f472fa1b1c242bc856c94bbabed2201eaec708c843a2a5eceebb79ec896
      # Headless 初始化：开箱即用的 org/project/账号与固定 demo 密钥（仅本地）。
      # 直接用下面的 pk/sk 计算 OTEL_TRACES_HEADERS，无需进 UI 建 project。
      LANGFUSE_INIT_ORG_ID: cove-local
      LANGFUSE_INIT_ORG_NAME: Cove Local
      LANGFUSE_INIT_PROJECT_ID: cove-local
      LANGFUSE_INIT_PROJECT_NAME: Cove
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-cove-local-0000000000000000
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-cove-local-0000000000000000
      LANGFUSE_INIT_USER_EMAIL: dev@cove.local
      LANGFUSE_INIT_USER_NAME: Cove Dev
      LANGFUSE_INIT_USER_PASSWORD: covedevpassword
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: langfuseredis
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      TELEMETRY_ENABLED: "false"

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment: *langfuse-env

  langfuse-postgres:
    image: docker.io/postgres:17
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - langfuse_pg:/var/lib/postgresql/data

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - langfuse_clickhouse:/var/lib/clickhouse
      # 单节点内嵌 Keeper 配置，支撑 Langfuse 的 ReplicatedMergeTree(ON CLUSTER default)。
      - ./clickhouse/config.d/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro

  minio:
    image: docker.io/minio/minio:latest
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - langfuse_minio:/data

  # 一次性初始化：创建 Langfuse 事件所需的 bucket（否则 OTLP 摄取会 NoSuchBucket → 500）。
  minio-setup:
    image: docker.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - "mc alias set local http://minio:9000 minio miniosecret && mc mb -p local/langfuse && echo 'langfuse bucket ready'"
    restart: "no"

  redis:
    image: docker.io/redis:7
    command: ["redis-server", "--requirepass", "langfuseredis"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "langfuseredis", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  langfuse_pg:
  langfuse_clickhouse:
  langfuse_minio:
